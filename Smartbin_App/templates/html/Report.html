{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Form</title>
  <link rel="stylesheet" href="{% static 'css/Report.css' %}">
  <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer.css' %}">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
  <!-- Navbar will be loaded here -->
  {% include 'navbar.html' %}
  <div class="overlay"></div>
  <div class="container">
    <h1>Complaint Form</h1>
    <p class="subheading">Please provide the details of your complaint below.</p>
    
    <!-- Display messages -->
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}" style="padding: 10px; margin: 10px 0; border-radius: 5px; {% if message.tags == 'error' %}background-color: #f8d7da; color: #721c24;{% else %}background-color: #d4edda; color: #155724;{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form id="complaintForm" method="POST" action="{% url 'addComplaint' %}" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="form-grid">
        <!-- Full Name -->
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" name="name" placeholder="Enter your full name" required>
        </div>

        <!-- Phone -->
        <div class="input-group">
          <label for="phoneNo">Phone Number</label>
          <input type="tel" id="phoneNo" name="phone_no" placeholder="Enter your phone number" maxlength="10" required>
        </div>

        <!-- Email -->
        <div class="input-group">
          <label for="emailId">Email ID</label>
          <input type="email" id="emailId" name="email_id" placeholder="Enter your email" required>
        </div>

        <!-- Address -->
        <div class="input-group full-width">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Enter your address">
        </div>

        <!-- Complaint Type -->
        <div class="input-group full-width">
          <label for="complaintType">Complaint Type</label>
          <select id="complaintType" name="complaint_type" required>
            <option value="">-- Select Complaint Type --</option>
            <option value="Garbage not collected">Garbage not collected</option>
            <option value="Overflowing bin">Overflowing bin</option>
            <option value="Damaged bin">Damaged bin</option>
            <option value="Collection delay">Collection delay</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Upload Photo -->
        <div class="input-group full-width">
          <label for="photoUpload">Upload Photo</label>
          <input type="file" id="photoUpload" name="photo" accept="image/*">
        </div>

        <!-- Description -->
        <div class="input-group full-width">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" placeholder="Describe your complaint..." required></textarea>
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </div>
  // <div id="footer-placeholder"></div>
  {% include 'footer.html' %}

  <script src="{% static 'js/Report.js' %}"></script>
  <script src="{% static 'js/navbar.js' %}"></script>
  
      

 
  
</body>
</html>
