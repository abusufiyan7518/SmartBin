{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}"> <!-- your main CSS -->
        <link rel="stylesheet" href="{% static 'css/contact.css' %}"> <!-- contact specific CSS -->
        <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
        <link rel="stylesheet" href="{% static 'css/footer.css' %}">
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    </head>
    <body>

    <!-- Navbar placeholder  -->
    {% include 'navbar.html' %}
  

  =

  


</body>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="contact-container">
            <div class="contact-header">
                <h2>Contact Us</h2>
                <p>Have questions or want to work with us? Fill out the form below and we will get back to you soon.</p>
            </div>
            <form class="contact-form">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="tel" name = "Phone no" placeholder="Your Phone No">
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn contact-btn">Send Message</button>
            </form>
        </div>
    </section>
    <script src="{% static 'js/navbar.js' %}"></script>
    <script src="{% static 'js/contact.js' %}"></script>
</section>

  {% include 'footer.html' %}

  <script src="{% static 'js/home.js' %}"></script>
  <script src="{% static 'js/navbar.js' %}"></script>
</body>
</html>
</body>
</html>
